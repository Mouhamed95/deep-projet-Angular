<form (ngSubmit)="onSubmit({ title: title.value, text:text.value})" #form>
  <app-control label="Title">
    <input type="text" name="title" id="title" #title />
  </app-control>

  <app-control label="Request">
    <textarea
      name="request"
      id="request"
      type="text"
      [rows]="3"
      #text
    ></textarea>
  </app-control>

  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">→</span>
    </button>
  </p>
</form>
