<div>
  <ul>
    @for (ticket of tickets; track ticket.id) {
    <li><app-tickets [data]="ticket" (close)="onCloseTickets(ticket.id)" /></li>
    }@empty{
    <p>No Tickets available</p>
    }
  </ul>
</div>

<div id="new-ticket">
  <app-new-ticket (add)="onAdd($event)" />
</div>
